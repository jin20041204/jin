spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jin_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080

jwt:
  secret: change_this_secret_to_a_strong_value
  expiration-ms: 86400000 # 1 day

